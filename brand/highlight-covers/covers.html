<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>InkLusion highlight covers</title>
<style>
  @font-face { font-family: "Pirata"; src: url("../../reels/fonts/PirataOne-Regular.woff2") format("woff2"); }
  html, body { margin: 0; background: #000; }
  svg.cover { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<script>
// Dark traditional flash: black & grey linework, stipple shading, small hits of pink. No glow.
// Art sits inside the centre circle (radius ~420) that Instagram shows.
const CREAM = "#ece6e3", GREY = "#77707a", PINK = "#ff2bd6", INK = "#0a090a";
const L = (w) => `stroke="${CREAM}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const shade = (d) => `<path d="${d}" fill="url(#dots)"/>`;

function banner(y, text, w, size = 80) {
  const h = 112, x0 = -w / 2, x1 = w / 2, a = 26;
  const tail = (s) => {
    const xe = s * (w / 2), xo = s * (w / 2 + 110);
    return `<path d="M${xe - s * 30},${y - h / 2 + 30} L${xo},${y - h / 2 + 38} L${xo - s * 42},${y + 16} L${xo},${y + h / 2 + 38} L${xe - s * 30},${y + h / 2 + 30}Z" fill="${INK}" ${L(8)}/>
            ${shade(`M${xe - s * 30},${y - h / 2 + 30} L${xo},${y - h / 2 + 38} L${xo - s * 42},${y + 16} L${xo},${y + h / 2 + 38} L${xe - s * 30},${y + h / 2 + 30}Z`)}
            <path d="M${xe},${y + h / 2 - a + 4} L${xe - s * 30},${y + h / 2 + 30} L${xe - s * 30},${y + h / 2 - 12}Z" fill="${INK}" ${L(6)}/>`;
  };
  return `${tail(-1)}${tail(1)}
    <path d="M${x0},${y - h / 2} Q0,${y - h / 2 - a * 2} ${x1},${y - h / 2} L${x1},${y + h / 2 - a} Q0,${y + h / 2 - a * 3} ${x0},${y + h / 2 - a}Z" fill="${INK}" ${L(9)}/>
    <path id="bp${y}${text.length}" d="M${x0 + 20},${y + 14} Q0,${y + 14 - a * 2} ${x1 - 20},${y + 14}" fill="none"/>
    <text font-family="Pirata" font-size="${size}" fill="${CREAM}" letter-spacing="3"><textPath href="#bp${y}${text.length}" startOffset="50%" text-anchor="middle">${text}</textPath></text>`;
}

function background() {
  return `<rect x="-540" y="-960" width="1080" height="1920" fill="#070607"/>
    <rect x="-540" y="-960" width="1080" height="1920" filter="url(#grain)" opacity=".05"/>
    <circle r="560" fill="url(#halo)"/>
    <circle r="448" fill="none" stroke="${CREAM}" stroke-width="3" opacity=".35"/>
    <circle r="432" fill="none" stroke="${CREAM}" stroke-width="1.5" opacity=".2"/>`;
}

// ---------------------------------------------------------------- 1. reviews: skull & crossbones
function bone(angle) {
  const k = (x, y) => `<circle cx="${x}" cy="${y}" r="24" fill="${INK}" ${L(8)}/>`;
  return `<g transform="rotate(${angle})">
    ${k(-250, -20)}${k(-250, 20)}${k(250, -20)}${k(250, 20)}
    <rect x="-252" y="-22" width="504" height="44" rx="10" fill="${INK}" ${L(8)}/>
    <rect x="-262" y="-12" width="524" height="24" fill="${INK}"/>
    ${shade("M-230,6 L230,6 L230,22 L-230,22Z")}
  </g>`;
}
function skull() {
  let s = `<g transform="translate(0,-40)">${bone(32)}${bone(-32)}`;
  const cranium = "M-150,-70 C-150,-270 150,-270 150,-70 C150,-10 122,14 112,48 L98,92 L-98,92 L-112,48 C-122,14 -150,-10 -150,-70Z";
  s += `<path d="${cranium}" fill="${INK}" ${L(11)}/>`;
  s += shade("M-150,-70 C-150,-170 -110,-220 -60,-238 C-110,-190 -124,-120 -112,-40 C-104,10 -112,40 -112,48 C-122,14 -150,-10 -150,-70Z");
  s += shade("M150,-70 C150,-170 110,-220 60,-238 C110,-190 124,-120 112,-40 C104,10 112,40 112,48 C122,14 150,-10 150,-70Z");
  s += `<path d="M30,-252 L18,-210 L40,-188 L26,-150" fill="none" ${L(5)}/>`;
  // jaw + teeth
  s += `<path d="M-88,96 L88,96 L78,164 C52,192 -52,192 -78,164Z" fill="${INK}" ${L(10)}/>`;
  s += shade("M-78,164 C-52,192 52,192 78,164 L80,150 L-80,150Z");
  s += `<path d="M-84,124 L84,124" ${L(6)}/>`;
  for (let x = -60; x <= 60; x += 24) s += `<path d="M${x},96 L${x},150" ${L(5)}/>`;
  // sockets with pink eyes, nose
  s += `<path d="M-108,-62 C-108,-122 -26,-124 -24,-60 C-22,-12 -108,-4 -108,-62Z" fill="#000" ${L(8)}/>`;
  s += `<path d="M108,-62 C108,-122 26,-124 24,-60 C22,-12 108,-4 108,-62Z" fill="#000" ${L(8)}/>`;
  s += `<circle cx="-62" cy="-58" r="13" fill="${PINK}"/><circle cx="62" cy="-58" r="13" fill="${PINK}"/>`;
  s += `<path d="M0,-6 L-24,44 C-10,36 10,36 24,44Z" fill="#000" ${L(7)}/>`;
  s += `</g>`;
  return s + banner(265, "reviews", 470);
}

// ---------------------------------------------------------------- 2. highlights: dagger
function dagger() {
  let s = `<g transform="translate(0,-78)">`;
  s += `<circle cx="0" cy="-318" r="30" fill="${INK}" ${L(9)}/>`;
  s += shade("M-20,-318 A20,20 0 0,0 20,-318Z");
  s += `<rect x="-28" y="-292" width="56" height="128" rx="8" fill="${INK}" ${L(9)}/>`;
  for (let y = -278; y < -170; y += 22) s += `<path d="M-26,${y + 16} L26,${y}" ${L(5)}/>`;
  s += `<path d="M-150,-168 C-128,-190 -60,-176 0,-178 C60,-176 128,-190 150,-168 C128,-142 60,-150 0,-146 C-60,-150 -128,-142 -150,-168Z" fill="${INK}" ${L(9)}/>`;
  s += `<circle cx="-158" cy="-168" r="18" fill="${INK}" ${L(8)}/><circle cx="158" cy="-168" r="18" fill="${INK}" ${L(8)}/>`;
  s += `<circle cx="0" cy="-162" r="16" fill="${PINK}" ${L(6)}/>`;
  const blade = "M-46,-140 L46,-140 L4,232 L-4,232Z";
  s += `<path d="${blade}" fill="${INK}" ${L(10)}/>`;
  s += shade("M-46,-140 L0,-140 L0,232 L-4,232Z");
  s += `<path d="M0,-136 L0,200" ${L(5)}/>`;
  // a drop of pink
  s += `<path d="M4,232 C4,250 -14,262 -14,280 C-14,296 22,296 22,280 C22,262 4,250 4,232Z" fill="${PINK}" ${L(6)}/>`;
  s += `</g>`;
  return s + banner(300, "highlights", 540);
}

// ---------------------------------------------------------------- 3. FAQs: fanged snake as a question mark
function snake() {
  const body = "M-150,-170 C-150,-335 170,-345 168,-170 C166,-60 18,-58 10,40";
  let s = `<g transform="translate(0,-92) scale(0.8)">`;
  s += `<path d="M-190,-172 C-194,-110 -168,-82 -118,-74 C-146,-100 -116,-128 -110,-172Z" fill="${INK}" ${L(8)}/>`;
  s += `<path d="${body}" fill="none" stroke="${CREAM}" stroke-width="98"/>`;
  s += `<path d="${body}" fill="none" stroke="${INK}" stroke-width="80"/>`;
  s += `<path d="${body}" fill="none" stroke="url(#dots)" stroke-width="80"/>`;
  s += `<path d="${body}" fill="none" stroke="${INK}" stroke-width="80" stroke-dasharray="18 28"/>`;
  s += `<path d="${body}" fill="none" stroke="${CREAM}" stroke-width="4" stroke-dasharray="18 28" stroke-dashoffset="-18" opacity=".7"/>`;
  // head: wedge, brows, fangs
  s += `<path d="M-56,18 C-70,92 -28,150 10,164 C48,150 90,92 76,18 C44,0 -24,0 -56,18Z" fill="${INK}" ${L(10)}/>`;
  s += shade("M-56,18 C-70,92 -28,150 10,164 C-20,130 -40,80 -34,20Z");
  s += `<path d="M-40,52 L-2,70 M60,52 L22,70" ${L(7)}/>`;
  s += `<ellipse cx="-16" cy="86" rx="12" ry="14" fill="${PINK}"/><ellipse cx="36" cy="86" rx="12" ry="14" fill="${PINK}"/>`;
  s += `<rect x="-18" y="76" width="4" height="20" rx="2" fill="${INK}"/><rect x="34" y="76" width="4" height="20" rx="2" fill="${INK}"/>`;
  s += `<path d="M-10,142 L-4,176 L2,146 M18,146 L24,176 L30,142" fill="${CREAM}" ${L(4)}/>`;
  s += `<path d="M10,164 L10,200 L-6,222 M10,200 L26,222" fill="none" stroke="${PINK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
  // the dot: a little skull
  s += `<g transform="translate(10,300)"><path d="M-44,0 C-44,-60 44,-60 44,0 C44,22 30,30 28,44 L-28,44 C-30,30 -44,22 -44,0Z" fill="${INK}" ${L(8)}/>
       <circle cx="-17" cy="0" r="12" fill="#000" ${L(5)}/><circle cx="17" cy="0" r="12" fill="#000" ${L(5)}/>
       <path d="M-12,44 L-12,56 M0,44 L0,56 M12,44 L12,56" ${L(5)}/></g>`;
  s += `</g>`;
  return s + banner(300, "faqs", 380);
}

// ---------------------------------------------------------------- 4. DM: bat carrying a letter
function batWing() {
  const w = "M34,-96 C120,-210 262,-200 334,-138 C304,-114 294,-82 304,-48 C264,-70 232,-62 218,-30 C188,-62 152,-56 132,-20 C110,-52 70,-52 40,-22Z";
  return `<path d="${w}" fill="${INK}" ${L(9)}/>
    ${shade("M34,-96 C120,-210 262,-200 334,-138 C250,-150 150,-130 34,-60Z")}
    <path d="M40,-80 L304,-48 M40,-80 L218,-30 M40,-80 L132,-20 M40,-80 L250,-170" fill="none" ${L(5)}/>`;
}
function bat() {
  let s = `<g transform="translate(0,-60)">${batWing()}<g transform="scale(-1,1)">${batWing()}</g>`;
  s += `<path d="M-46,-110 L-58,-200 L-18,-150 C-6,-156 6,-156 18,-150 L58,-200 L46,-110 C66,-70 56,20 0,40 C-56,20 -66,-70 -46,-110Z" fill="${INK}" ${L(10)}/>`;
  s += shade("M-46,-110 C-66,-70 -56,20 0,40 C-30,10 -40,-60 -22,-120Z");
  s += `<path d="M-30,-118 L-8,-106 M30,-118 L8,-106" ${L(6)}/>`;
  s += `<ellipse cx="-20" cy="-96" rx="10" ry="12" fill="${PINK}"/><ellipse cx="20" cy="-96" rx="10" ry="12" fill="${PINK}"/>`;
  s += `<path d="M-14,-62 L-8,-40 L-2,-62 M2,-62 L8,-40 L14,-62" fill="${CREAM}" ${L(4)}/>`;
  // feet + letter
  s += `<path d="M-16,36 L-26,62 M16,36 L26,62" ${L(7)}/>`;
  s += `<rect x="-110" y="60" width="220" height="140" rx="10" fill="${INK}" ${L(9)}/>`;
  s += `<path d="M-106,64 L0,138 L106,64" fill="none" ${L(7)}/>`;
  s += shade("M-106,196 L-30,120 L0,138 L30,120 L106,196Z");
  s += `<circle cx="0" cy="138" r="20" fill="${PINK}" ${L(6)}/>`;
  s += `</g>`;
  return s + banner(255, "dm me", 400);
}

const covers = [["reviews", skull], ["highlights", dagger], ["faqs", snake], ["dm-for-details", bat]];
for (const [name, art] of covers) {
  document.body.insertAdjacentHTML("beforeend", `
  <svg class="cover" id="${name}" viewBox="-540 -960 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="halo"><stop offset="0" stop-color="#2a1626" stop-opacity=".9"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
      <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.3" fill="${GREY}"/></pattern>
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    </defs>
    ${background()}
    ${art()}
  </svg>`);
}
</script>
</body>
</html>
